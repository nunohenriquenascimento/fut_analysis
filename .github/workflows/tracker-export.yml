name: Tracker export integration
on:
  push:
    branches: ['feat/campeonato-fpf']
    paths:
      - 'ccdr-match-tracker/backend/**'
      - 'ccdr-match-tracker/docs/FI-007.6.2.md'
      - '.github/workflows/tracker-export.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'ccdr-match-tracker/backend/**'
      - 'ccdr-match-tracker/docs/FI-007.6.2.md'
      - '.github/workflows/tracker-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    env:
      FOOTBALLIQ_CHECKOUT: ${{ github.workspace }}/footballiq-contract
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ccdr-match-tracker/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout immutable public FootballIQ contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nunohenriquenascimento/footballiq
          ref: aa4cfee94786be15f5e48142599a81526ad7d1ac
          path: footballiq-contract
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Verify pinned contract checkout
        run: |
          test "$(git -C "$FOOTBALLIQ_CHECKOUT" rev-parse HEAD)" = aa4cfee94786be15f5e48142599a81526ad7d1ac
          test -f "$FOOTBALLIQ_CHECKOUT/src/footballiq/schemas/integration.py"
      - run: python -m pip install -r requirements-dev.txt ruff==0.14.3 -e "$FOOTBALLIQ_CHECKOUT"
      - run: python -m pytest -p no:cacheprovider export_tests -q -rs
      - run: python -m ruff check ci_postgres_tests.py export_tests/test_ci_safety.py
      - run: python -m ruff format --check ci_postgres_tests.py export_tests/test_ci_safety.py
      - run: python -m pip check
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: tracker_ci
          POSTGRES_PASSWORD: tracker_ci_only
          POSTGRES_DB: tracker_export_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U tracker_ci -d tracker_export_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACKER_DISPOSABLE_CI: 'true'
      TRACKER_CI_DATABASE_URL: postgresql+psycopg://tracker_ci:tracker_ci_only@127.0.0.1:55439/tracker_export_ci
    defaults:
      run:
        working-directory: ccdr-match-tracker/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -p no:cacheprovider ci_postgres_tests.py -q -rs --junitxml=postgres-results.xml
      - name: Require both real PostgreSQL tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("postgres-results.xml").findall(".//testcase")
          assert len(cases) == 2, "Expected exactly two PostgreSQL tests"
          assert all(len(case) == 0 for case in cases), "PostgreSQL tests must pass without skips"
          print("PostgreSQL: 2 passed, 0 skipped")
          PY
      - run: python -m pip check
